services:
  postgres-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:${POSTGRES_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:?set POSTGRES_DB_PASSWORD}
      POSTGRES_DB: imeetly
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - imeetly-data-prod:/var/lib/postgresql/data
      - ./tools/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imeetly"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  site:
    image: ghcr.io/proghublabs/imeetly-site:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=site
      - PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/proghublabs/imeetly-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=web
      - PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    image: ghcr.io/proghublabs/imeetly-server:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=server
      - DATABASE_URL=postgres://postgres:${POSTGRES_DB_PASSWORD}@postgres-db:5432/imeetly
      - PORT=4000
      - SERVER_PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/rpc/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres-db:
        condition: service_healthy
      temporal:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ghcr.io/proghublabs/imeetly-worker:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=worker
      - DATABASE_URL=postgres://postgres:${POSTGRES_DB_PASSWORD}@postgres-db:5432/imeetly
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      postgres-db:
        condition: service_healthy
      temporal:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:1.26.2
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-db
      - DEFAULT_NAMESPACE=default
    depends_on:
      temporal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:2.36.0
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  # Persistent named volume for app Postgres data. Compose/Dokploy creates it
  # automatically if missing; data persists until the volume is explicitly removed.
  imeetly-data-prod:
  temporal-data-prod:
    external: true
