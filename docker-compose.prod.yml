services:
  site:
    image: ghcr.io/proghublabs/imeetly-site:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=site
      - PORT=4002
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/proghublabs/imeetly-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=web
      - PORT=4001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4001/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    image: ghcr.io/proghublabs/imeetly-server:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=server
      - SERVER_PORT=4000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - temporal
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ghcr.io/proghublabs/imeetly-worker:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=worker
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      - temporal
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  temporal-data:
