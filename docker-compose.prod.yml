services:
  web:
    image: ghcr.io/proghublabs/aimeetly-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4001}:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=web
      - PORT=4001
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://localhost:4001/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    image: ghcr.io/proghublabs/aimeetly-server:latest
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=server
      - SERVER_PORT=4000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://localhost:4000/rpc/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ghcr.io/proghublabs/aimeetly-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_MODULE=worker
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DEFAULT_NAMESPACE=default
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7233/health | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "8233:8233"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:4001
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  temporal-data:
