api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: :80
  websecure:
    address: :443
  traefik:
    address: :8080

serversTransport:
  rootCAs:
    - ./tools/traefik/certs/rootCA.pem

providers:
  file:
    filename: ./tools/traefik/config.yaml
    watch: true

log:
  level: ERROR
