http:
  routers:
    traefik:
      entryPoints:
        - websecure
      rule: "Host(`traefik.aimeetly.dev`)"
      service: traefik
      tls:
        options: aimeetly
        domains:
          - main: "aimeetly.dev"
    mailpit:
      entryPoints:
        - websecure
      rule: "Host(`mailpit.aimeetly.dev`)"
      service: mailpit
      tls:
        options: aimeetly
        domains:
          - main: "aimeetly.dev"
    temporal:
      entryPoints:
        - websecure
      rule: "Host(`temporal.aimeetly.dev`)"
      service: temporal
      tls:
        options: aimeetly
        domains:
          - main: "aimeetly.dev"
    server:
      entryPoints:
        - websecure
      rule: "Host(`server.aimeetly.dev`)"
      service: server
      tls:
        options: aimeetly
        domains:
          - main: "aimeetly.dev"
    web:
      entryPoints:
        - websecure
      rule: "Host(`app.aimeetly.dev`)"
      service: web
      tls:
        options: aimeetly
        domains:
          - main: "aimeetly.dev"

  services:
    traefik:
      loadbalancer:
        servers:
          - url: "http://localhost:8080"
    mailpit:
      loadbalancer:
        servers:
          - url: "http://localhost:8025"
    temporal:
      loadbalancer:
        servers:
          - url: "http://localhost:8233"
    server:
      loadbalancer:
        servers:
          - url: "http://localhost:4000"
    web:
      loadbalancer:
        servers:
          - url: "http://localhost:4001"
tls:
  stores:
    default:
      defaultCertificate:
        certFile: ./tools/certs/aimeetly.dev.pem
        keyFile: ./tools/certs/aimeetly.dev-key.pem
  options:
    aimeetly:
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
