http:
  routers:
    traefik:
      entryPoints:
        - websecure
      rule: "Host(`traefik.imeetly.dev`)"
      service: traefik
      tls:
        options: imeetly
        domains:
          - main: "imeetly.dev"
    mailpit:
      entryPoints:
        - websecure
      rule: "Host(`mailpit.imeetly.dev`)"
      service: mailpit
      tls:
        options: imeetly
        domains:
          - main: "imeetly.dev"
    temporal:
      entryPoints:
        - websecure
      rule: "Host(`temporal.imeetly.dev`)"
      service: temporal
      tls:
        options: imeetly
        domains:
          - main: "imeetly.dev"
    server:
      entryPoints:
        - websecure
      rule: "Host(`server.imeetly.dev`)"
      service: server
      tls:
        options: imeetly
        domains:
          - main: "imeetly.dev"
    web:
      entryPoints:
        - websecure
      rule: "Host(`app.imeetly.dev`)"
      service: web
      tls:
        options: imeetly
        domains:
          - main: "imeetly.dev"

  services:
    traefik:
      loadbalancer:
        servers:
          - url: "http://localhost:8080"
    mailpit:
      loadbalancer:
        servers:
          - url: "http://localhost:8025"
    temporal:
      loadbalancer:
        servers:
          - url: "http://localhost:8233"
    server:
      loadbalancer:
        servers:
          - url: "http://localhost:4000"
    web:
      loadbalancer:
        servers:
          - url: "http://localhost:4001"
tls:
  stores:
    default:
      defaultCertificate:
        certFile: ./tools/certs/imeetly.dev.pem
        keyFile: ./tools/certs/imeetly.dev-key.pem
  options:
    imeetly:
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
