version: "0.5"

processes:
  postgresql:
    command: "./tools/nix/scripts/rundb.sh"
    namespace: "tools"
    shutdown:
      command: "pg_ctl stop -m fast"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  redis:
    command: "redis-server redis.conf --port 6379"
    namespace: "tools"
    availability:
      restart: on_failure
      max_restarts: 5
    readiness_probe:
      exec:
        command: "redis-cli -p 6379 ping"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      exec:
        command: "redis-cli -p 6379 ping"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  traefik:
    command: "traefik --configfile ./tools/traefik/traefik.yaml"
    namespace: "tools"
    availability:
      backoff_seconds: 1
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/api/http/routers"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/api/overview"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  mailpit:
    command: "mailpit --smtp-auth-file ./.mailpit --smtp-auth-allow-insecure --smtp-tls-cert ./tools/certs/imeetly.dev.pem --smtp-tls-key ./tools/certs/imeetly.dev-key.pem"
    namespace: "tools"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8025
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8025
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  temporal:
    command: "temporal server start-dev"
    namespace: "tools"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8233
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8233
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  temporal-worker:
    command: "cd ./apps/worker && npm run dev"
    namespace: "worker"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "pgrep -f 'npm run dev'"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      exec:
        command: "pgrep -f 'npm run dev'"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  web:
    command: "bun dev -F @repo/web"
    namespace: "web"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 4001
        scheme: "http"
        path: "/health/ready"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 4001
        scheme: "http"
        path: "/health/live"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  server:
    command: "bun dev -F @repo/server"
    namespace: "server"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 4000
        scheme: "http"
        path: "/rpc/health/ready"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 4000
        scheme: "http"
        path: "/rpc/health/live"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
