version: "0.5"

processes:
  postgresql:
    command: "./tools/nix/scripts/rundb.sh"
    namespace: "tools"
    shutdown:
      command: "pg_ctl stop -m fast"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  traefik:
    command: "traefik --configfile ./tools/traefik/traefik.yaml"
    namespace: "tools"
    availability:
      backoff_seconds: 1
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/api/http/routers"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/api/overview"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  mailpit:
    command: "mailpit --smtp-auth-file ./.mailpit --smtp-auth-allow-insecure --smtp-tls-cert ./tools/certs/aimeetly.dev.pem --smtp-tls-key ./tools/certs/aimeetly.dev-key.pem"
    namespace: "tools"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8025
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8025
        scheme: "http"
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  core:
    command: "bun dev -F core"
    namespace: "web"
    disabled: true

  docs:
    command: "bun dev -F docs"
    namespace: "web"
    disabled: true

  site:
    command: "bun dev -F site"
    namespace: "web"
    disabled: true

  web:
    command: "bun dev -F web"
    namespace: "web"

  server:
    command: "bun dev -F server"
    namespace: "server"
