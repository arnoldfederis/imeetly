services:
  site:
    image: ghcr.io/proghublabs/imeetly-site:staging
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging
      - APP_MODULE=site
      - PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/proghublabs/imeetly-web:staging
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging
      - APP_MODULE=web
      - PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    image: ghcr.io/proghublabs/imeetly-server:staging
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging
      - APP_MODULE=server
      - PORT=4000
      - SERVER_PORT=4000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/rpc/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - temporal
      - mailpit
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ghcr.io/proghublabs/imeetly-worker:staging
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging
      - APP_MODULE=worker
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      - temporal
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DEFAULT_NAMESPACE=default
    depends_on:
      temporal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    deploy:
      resources:
        limits:
          memory: 128M

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8234:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  temporal-data: