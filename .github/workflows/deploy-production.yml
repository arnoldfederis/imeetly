name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run turbo check-types

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "${HOME}/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: temporal server start-dev --namespace default --log-format json &

      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal is ready"
              break
            fi
            echo "Waiting for Temporal... ($i/30)"
            sleep 1
          done

      - name: Test
        run: bun run test
        continue-on-error: true
        env:
          TEMPORAL_ADDRESS: localhost:7233
          TEMPORAL_NAMESPACE: default

  build:
    name: Build Production Images
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-web:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-web:${{ github.sha }}
          build-args: |
            VITE_APP_BASE_URL=${{ vars.VITE_APP_BASE_URL }}
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-server:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-server:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-worker:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-worker:${{ github.sha }}

  deploy:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Dokploy
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}", "title": "Deploy ${{ github.sha }}", "description": "Automated deploy from GitHub Actions"}'
