name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run turbo check-types

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "${HOME}/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: temporal server start-dev --namespace default --log-format json &

      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal is ready"
              break
            fi
            echo "Waiting for Temporal... ($i/30)"
            sleep 1
          done

      - name: Test
        run: bun run test
        continue-on-error: true
        env:
          TEMPORAL_ADDRESS: localhost:7233
          TEMPORAL_NAMESPACE: default

  changes:
    name: Detect Changed Apps
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'

  build-site:
    name: Build site
    needs: [ci, changes]
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/site/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-site:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-site:${{ github.sha }}
          build-args: |
            VITE_APP_BASE_URL=${{ vars.VITE_APP_BASE_URL }}
          cache-from: type=gha,scope=imeetly-site-production
          cache-to: type=gha,mode=max,scope=imeetly-site-production

  build-web:
    name: Build web
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-web:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_BASE_URL=${{ vars.NEXT_PUBLIC_APP_BASE_URL }}
            NEXT_PUBLIC_APP_SERVER_URL=${{ vars.NEXT_PUBLIC_APP_SERVER_URL }}
            NEXT_PUBLIC_POSTHOG_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
            NEXT_PUBLIC_GOOGLE_PICKER_APP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_APP_ID }}
          cache-from: type=gha,scope=imeetly-web-production
          cache-to: type=gha,mode=max,scope=imeetly-web-production

  build-server:
    name: Build server
    needs: [ci, changes]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-server:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-server:${{ github.sha }}
          cache-from: type=gha,scope=imeetly-server-production
          cache-to: type=gha,mode=max,scope=imeetly-server-production

  build-worker:
    name: Build worker
    needs: [ci, changes]
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-worker:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/imeetly-worker:${{ github.sha }}
          cache-from: type=gha,scope=imeetly-worker-production
          cache-to: type=gha,mode=max,scope=imeetly-worker-production

  deploy:
    name: Deploy Production
    needs: [build-site, build-web, build-server, build-worker]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Redeploy compose
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}", "title": "Deploy ${{ github.sha }}", "description": "Automated deploy from GitHub Actions"}'
