name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run turbo check-types

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "${HOME}/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: temporal server start-dev --namespace default --log-format json &

      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal is ready"
              break
            fi
            echo "Waiting for Temporal... ($i/30)"
            sleep 1
          done

      - name: Test
        run: bun run test
        continue-on-error: true
        env:
          TEMPORAL_ADDRESS: localhost:7233
          TEMPORAL_NAMESPACE: default

  build-and-push:
    name: Build and Push Images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/aimeetly-web:latest

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/aimeetly-server:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/aimeetly-worker:latest

  deploy:
    name: Trigger Dokploy deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            --data "{
              \"ref\": \"${{ github.ref }}\",
              \"repository\": {
                \"full_name\": \"${{ github.repository }}\"
              }
            }"